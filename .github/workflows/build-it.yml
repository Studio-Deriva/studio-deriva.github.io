name: Build the Italian pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - assets/i18n.js
      - tools/build-it.mjs
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-it
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write it/ from the English pages
        run: node tools/build-it.mjs
      - name: Publish if the Italian pages changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- it; then
            echo "Italian pages unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add it
          git commit -m "Update the Italian pages"
          git pull --rebase
          git push
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
