name: Sync staff from Discord

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - staff.config.json
      - tools/sync-staff.mjs

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-staff
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the staff from Discord
        run: node tools/sync-staff.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - name: Publish if the staff changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/staff.json; then
            echo "Staff unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/staff.json
          git commit -m "Update staff from Discord"
          git push
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
