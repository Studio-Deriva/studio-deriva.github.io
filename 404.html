<style>
/* 404: the home page's character field, with the missing page's number in the middle. */
.lost {
  --tint: #3D5BFF;
  position: relative; min-height: 100svh; overflow: hidden;
  display: grid; place-items: center;
  background: radial-gradient(120% 80% at 50% 45%, #0B1250 0%, var(--ink) 62%);
  cursor: crosshair; outline: none;
}
.lost canvas { position: absolute; inset: 0; display: block; }
.lost-stage { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; gap: 1.2rem; padding: 6rem max(16px, env(safe-area-inset-right, 0px)) 5rem max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.lost-stage a { pointer-events: auto; }
.code { display: flex; align-items: center; gap: clamp(.4rem, 2vw, 1.2rem); font: 900 clamp(6rem, 22vw, 14rem)/.9 var(--f-display); font-stretch: 125%; letter-spacing: -.04em; }
.code img { width: clamp(70px, 14vw, 150px); height: auto; filter: drop-shadow(0 0 40px color-mix(in srgb, var(--tint) 60%, transparent)); transition: filter 1.2s var(--ease); animation: drift 8s ease-in-out infinite; }
@keyframes drift { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
.lost h1 { font-size: clamp(1.8rem, 4.5vw, 3rem); font-weight: 800; }
.lost .lede { color: #C4CBF0; text-align: center; max-width: 42ch; }
.path { font: 400 .85rem/1.4 var(--f-mono); color: var(--mist); background: rgba(5, 8, 28, .6); padding: .35rem .7rem; border-radius: 6px; max-width: min(90vw, 560px); overflow-wrap: anywhere; }
.lost-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem; margin-top: .4rem; }
.hint { position: absolute; z-index: 1; left: 50%; bottom: calc(1.6rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font: 400 .72rem/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mist); display: flex; align-items: center; gap: .6rem; white-space: nowrap; pointer-events: none; }
.hint i { width: .5rem; height: .5rem; border-radius: 50%; background: var(--tint); box-shadow: 0 0 12px var(--tint); transition: background 1.2s; }
@media (prefers-reduced-motion: reduce) { .code img { animation: none; } }
</style>

<main class="lost" data-field tabindex="0" aria-label="Character field. Move the cursor to light it, click to colour it.">

    <p class="code" aria-label="404">4<img src="/assets/logo.svg" alt="" width="150" height="222">4</p>

    <p class="lede">The page you were looking for moved, never existed, or was mined by someone else.</p>
    <p class="path" id="lost-path" hidden></p>
    <div class="lost-cta">
      <a class="btn btn-primary" href="/">Back to the home page</a>

</main>

<script>
  // Show which address was missing, so a broken link is easy to report.
  (function () {
    var p = document.getElementById('lost-path');
    var path = decodeURI(location.pathname + location.search);
    if (path && path !== '/404.html') { p.textContent = path; p.hidden = false; }
  })();
</script>
